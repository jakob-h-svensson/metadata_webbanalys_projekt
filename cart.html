<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    
    <title>Whey To Go | Dryck</title>
    

    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="cart.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header>
        <div>
            <a href="index.html">
                <img src="images/nav_logo.png" height="100px" alt="Whey To Go Logotyp">
            </a>
            <form action="search.html" method="GET">
                <input type="search" name="q" placeholder="Sök bland 10-tals produkter">    
            </form>
            <div class="lucide-icons">
                <a href="cart.html" aria-label="Gå till varukorg">
                    <i data-lucide="shopping-cart"></i>
                </a>
                <a href="placeholder-login.html" aria-label="Logga in">
                    <i data-lucide="user"></i>
                </a>
            </div>
        </div>
        <nav>
            <a href="protein.html">Protein</a>
            <a href="kreatin.html">Kreatin</a>
            <a href="dryck.html">Dryck</a>
            <a href="vitaminer.html">Vitaminer & Mineraler</a>
            <a href="tillbehor.html">Tillbehör</a>
        </nav>
    </header>

    <main>
        <h1>Varukorg</h1>

        <table>
            <thead>
                <tr>
                    <th>Produkt</th>
                    <th>Pris</th>
                    <th>Antal</th>
                    <th>Summa</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="cart-item-info">
                        <img src="images/protein1.png" alt="Protein">
                        <span>Protein Whey80, 1000g</span>
                    </td>
                    <td>299 kr</td>
                    <td>
                        <div class="quantity-selector">
                            <button aria-label="Minska antal">-</button>
                            <input type="number" value="1" min="1">
                            <button aria-label="Öka antal">+</button>
                        </div>
                    </td>
                    <td><b>299 kr</b></td>
                    <td><button class="remove-btn" aria-label="Ta bort">Ta bort</button></td>
                </tr>
                <tr>
                    <td class="cart-item-info">
                        <img src="images/kreatin.png" alt="Kreatin">
                        <span>Kreatin Monohydrate, 500 g</span>
                    </td>
                    <td>179 kr</td>
                    <td>
                        <div class="quantity-selector">
                            <button aria-label="Minska antal">-</button>
                            <input type="number" value="2" min="1">
                            <button aria-label="Öka antal">+</button>
                        </div>
                    </td>
                    <td><b>358 kr</b></td>
                    <td><button class="remove-btn" aria-label="Ta bort">Ta bort</button></td>
                </tr>
            </tbody>
        </table>

        <section>
            <div>
                <span>Delsumma</span>
                <span>657 kr</span>
            </div>
            <div>
                <span>Frakt</span>
                <span>49 kr</span>
            </div>
            <div class="cart-summary-total">
                <span>Totalt</span>
                <span>706 kr</span>
            </div>
            <button>Till kassan</button>
        </section>
    </main>

    <footer>
        <a href="about.html">Om oss</a>
        <a href="index.html">Kontakt</a>
        <p>&copy; 2026 WheyToGo</p>
    </footer>
<script>
    lucide.createIcons();
</script>
</body>
</html>
